<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C-ML Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='22 12 18 12 15 21 9 3 6 12 2 12'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <!-- Unified top-level shell: one topbar + one server, each view is a same-origin
       iframe (the Visualizer and Experiment-tracker apps declare colliding globals,
       so they are isolated per-frame rather than merged onto one page). -->
  <header class="shell-topbar">
    <a class="shell-brand" href="#experiments" aria-label="C-ML home">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.4"
           stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      <span>C-ML</span>
    </a>

    <nav class="shell-nav" role="tablist">
      <button class="shell-nav-item" data-view="experiments" role="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span>Experiments</span>
      </button>
      <button class="shell-nav-item" data-view="graph" role="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>
        <span>Graph</span>
      </button>
      <button class="shell-nav-item" data-view="training" role="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
        <span>Training</span>
      </button>
      <button class="shell-nav-item" data-view="kernels" role="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        <span>Kernel Studio</span>
      </button>
    </nav>

    <div class="shell-conn" id="shell-conn" title="Server status">
      <span class="shell-conn-dot"></span>
      <span class="shell-conn-label">connecting…</span>
    </div>
  </header>

  <main class="shell-body">
    <!-- Views: the experiment tracker + the visualizer, isolated same-origin frames. -->
    <iframe class="shell-frame" id="frame-experiments" title="Experiments" loading="lazy"></iframe>
    <iframe class="shell-frame" id="frame-viz" title="Visualizer" loading="lazy"></iframe>
    <div class="shell-empty" id="shell-empty" hidden></div>
  </main>

  <script src="dashboard.js"></script>
</body>
</html>
