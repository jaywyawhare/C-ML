<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C-ML Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237c9cff' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='22 12 18 12 15 21 9 3 6 12 2 12'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <!-- Unified top-level shell: one topbar + one server, each view is a same-origin
       iframe (the Visualizer and Experiment-tracker apps declare colliding globals,
       so they are isolated per-frame rather than merged onto one page). -->
  <header class="shell-topbar">
    <a class="shell-brand" href="#experiments" aria-label="C-ML home">
      <span class="shell-brand-name">c-ml</span>
      <span class="shell-brand-sep" aria-hidden="true">/</span>
      <span class="shell-brand-view" id="shell-view">experiments</span>
    </a>

    <nav class="shell-nav" role="tablist">
      <button class="shell-nav-item" data-view="experiments" role="tab">Experiments</button>
      <button class="shell-nav-item" data-view="graph" role="tab">Graph</button>
      <button class="shell-nav-item" data-view="training" role="tab">Training</button>
      <button class="shell-nav-item" data-view="kernels" role="tab">Kernels</button>
      <button class="shell-nav-item" data-view="profile" role="tab">Profile</button>
    </nav>

    <div class="shell-conn" id="shell-conn" title="Visualizer server">
      <span class="shell-conn-dot" aria-hidden="true"></span>
      <span class="shell-conn-label">Connecting</span>
    </div>
  </header>

  <main class="shell-body">
    <!-- Views: the experiment tracker + the visualizer, isolated same-origin frames. -->
    <!-- No loading="lazy": these start display:none and the router assigns src
         while they are still hidden, so a lazy frame can be judged permanently
         out-of-viewport and never load. Deferral is already handled by the
         router, which leaves src empty until a view is first activated. -->
    <iframe class="shell-frame" id="frame-experiments" title="Experiments"></iframe>
    <iframe class="shell-frame" id="frame-viz" title="Visualizer"></iframe>
    <div class="shell-empty" id="shell-empty" hidden></div>
  </main>

  <script src="dashboard.js"></script>
</body>
</html>
