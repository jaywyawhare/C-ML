<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C-ML Experiments</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='22 12 18 12 15 21 9 3 6 12 2 12'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="exp.css">
  <!-- Embedded in the unified shell: drop the redundant brand + connection pill
       (the shell provides them) but KEEP the second-level sub-tabs. -->
  <style>
    html.embed .topbar .brand, html.embed .topbar .conn { display: none !important; }
    html.embed .topbar { justify-content: flex-start; }
  </style>
  <script>
    if (new URLSearchParams(location.search).get("embed") === "1" || window.self !== window.top)
      document.documentElement.classList.add("embed");
  </script>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      <span>C-ML <b>Experiments</b></span>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="conn" id="conn"><span class="dot"></span><span id="conn-label">live</span></div>
  </div>
  <div class="body">
    <aside class="sidebar">
      <div class="sidebar-head">
        <span>Runs</span>
        <span class="run-count" id="run-count">0</span>
      </div>
      <div class="run-list" id="run-list"></div>
    </aside>
    <main class="content" id="content"></main>
  </div>
  <script src="assets/d3.min.js"></script>
  <script src="assets/cytoscape.min.js"></script>
  <script src="assets/dagre.min.js"></script>
  <script src="assets/cytoscape-dagre.js"></script>
  <script src="exp.js"></script>
</body>
</html>
