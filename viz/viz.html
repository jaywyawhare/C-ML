<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C-ML Visualizer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237c9cff' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='22 12 18 12 15 21 9 3 6 12 2 12'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="viz.css">
  <link rel="stylesheet" href="assets/styles/github-dark.min.css">
  <!-- When embedded in the unified shell (?embed=1) the shell provides the
       top-level nav, so hide this app's own topbar and let the panel fill. -->
  <style>
    html.embed .topbar { display: none !important; }
    html.embed, html.embed body, html.embed .app, html.embed .main-content { height: 100%; }
  </style>
  <script>
    if (new URLSearchParams(location.search).get("embed") === "1" || window.self !== window.top)
      document.documentElement.classList.add("embed");
  </script>
</head>
<body>
  <div class="app">
    <div class="main-content">
      <!-- Topbar -->
      <div class="topbar">
        <div class="topbar-logo">
          <div class="title">c-ml <span class="title-sep">/</span> viz</div>
        </div>

        <div class="topbar-buttons">
          <button class="topbar-button active" data-tab="graph">Graph</button>
          <button class="topbar-button" data-tab="training">Training</button>
          <button class="topbar-button" data-tab="codegen">Kernels</button>
          <button class="topbar-button" data-tab="rewrites">Rewrites</button>
          <button class="topbar-button" data-tab="flamegraph">Profile</button>
        </div>

        <div class="conn-status" id="conn-status" title="Data stream status">
          <span class="conn-dot"></span>
          <span class="conn-label">Connecting</span>
          <span class="conn-time"></span>
        </div>
      </div>

      <!-- Panel -->
      <div class="panel">
        <div class="panel-body">
          <!-- Graph Tab -->
          <div id="tab-graph" class="tab-content active"></div>
          <!-- Training Tab -->
          <div id="tab-training" class="tab-content"></div>
          <!-- CodeGen Tab -->
          <div id="tab-codegen" class="tab-content"></div>
          <!-- Rewrites Tab -->
          <div id="tab-rewrites" class="tab-content"></div>
          <!-- Profile Tab -->
          <div id="tab-flamegraph" class="tab-content"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Vendored libs -->
  <script src="assets/cytoscape.min.js"></script>
  <script src="assets/dagre.min.js"></script>
  <script src="assets/cytoscape-dagre.js"></script>
  <script src="assets/elk.bundled.js"></script>
  <script src="assets/cytoscape-elk.js"></script>
  <script src="assets/d3.min.js"></script>
  <script src="assets/highlight.min.js"></script>
  <script src="assets/languages/c.min.js"></script>

  <!-- App code -->
  <script src="tokens.js"></script>
  <script src="viz-charts.js"></script>
  <script src="viz.js"></script>
</body>
</html>
