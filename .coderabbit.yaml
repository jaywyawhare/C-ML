# CodeRabbit: scoped review for PR #11 (custom allocator)
# Covers the allocator core + high-risk integration paths.
# 127 files in this PR (limit: 150). Excludes examples, zoo, GPU backends,
# distributed, and mechanical-only test/driver changes.

reviews:
  path_instructions:
    - path: "src/alloc/**"
      instructions: |
        - Review thread-local cache correctness, size-class boundaries, and alignment guarantees.
        - Flag use-after-free, double-free, and missing zero-init in cml_calloc paths.
        - Verify large-allocation fallback and slab lifecycle are sound.
    - path: "include/alloc/**"
      instructions: |
        - Check public API contracts for cml_malloc/cml_calloc/cml_realloc/cml_free/cml_aligned_*.
    - path: "src/tensor/**"
      instructions: |
        - Ensure malloc->cml_* migrations preserve ownership and error-path cleanup.
    - path: "src/ops/ir/**"
      instructions: |
        - Focus on graph/node lifetime, intern table frees, and memory planner interactions.
