name: Python wheels

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    paths: ['python/**', 'CMakeLists.txt', '.github/workflows/wheels.yml']

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist
        # Use the setup-python interpreter (not pipx's default) so the build
        # Python matches everywhere.
        run: |
          python -m pip install build
          python -m build --sdist --outdir dist python/
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: macos-14
            arch: arm64
          - os: windows-latest
            arch: amd64
    runs-on: ${{ matrix.os }}
    # The C library is POSIX-centric (dlopen/pthread/mmap and GCC/Clang warning
    # flags); MSVC support is a separate effort, so the Windows wheel is
    # best-effort and does not fail the workflow.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The C library builds via CMake inside build_cffi.py; wheels bundle the
      # compiled _cml_lib into the wheel (see python/cml/_cml_cffi.py). Build
      # with the setup-python interpreter (not pipx's default, which may be a
      # different Python) so the cpXY-tagged wheel matches the test-install job.
      - name: Build wheel (POSIX)
        if: runner.os != 'Windows'
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist python/

      # Windows has no MSVC-compatible toolchain for the POSIX-centric C code, so
      # build with MinGW-w64 (GCC): CMake and cffi both use gcc, matching the
      # GCC/Clang flags and the dynlib.h LoadLibrary shim.
      - name: Set up MinGW-w64 (Windows)
        if: runner.os == 'Windows'
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64

      - name: Build wheel (Windows/MinGW)
        if: runner.os == 'Windows'
        shell: bash
        env:
          CC: gcc
          CXX: g++
          CMAKE_GENERATOR: "MinGW Makefiles"
        run: |
          python -m pip install build
          # Make cffi's distutils extension build use MinGW gcc, not MSVC.
          printf '[build]\ncompiler=mingw32\n[build_ext]\ncompiler=mingw32\n' \
            > "$USERPROFILE/pydistutils.cfg"
          python -m build --wheel --outdir dist python/
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.whl

  test-install:
    needs: [wheels]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: 'wheel-${{ matrix.os }}-*', merge-multiple: true, path: dist }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install and smoke-test
        run: |
          pip install dist/*.whl numpy pytest cffi
          python -c "import cml; cml.init(); import numpy as np; \
            t = cml.Tensor(np.arange(6, dtype=np.float32).reshape(2,3)); \
            assert np.allclose(t.numpy(), np.arange(6, dtype=np.float32).reshape(2,3)); \
            print('smoke OK')"
