name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'python/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'python/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ccache-action installs ccache, sets its cache dir, restores/saves the GitHub
# cache, and prints stats. Each job keys its own cache; 500M each keeps the
# build jobs under GitHub's 10GB per-repo budget.

jobs:
  build-and-test:
    timeout-minutes: 40
    # macOS is a best-effort target (LLVM/CUDA/ROCm/io_uring/InfiniBand are
    # Linux-only); its leg runs informationally and does not fail CI.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        exclude:
          # /usr/bin/gcc on macOS is just an alias for clang
          - os: macos-latest
            compiler: gcc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}
          max-size: 500M

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=OFF \
            -DCML_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_C_COMPILER=$CC \
            -DCML_NATIVE_OPTIMIZATIONS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}

      - name: Build
        run: cmake --build build -j$(getconf _NPROCESSORS_ONLN)

      - name: Run tests
        run: cd build && ctest --output-on-failure --timeout 240

      - name: Show crash reports (macOS)
        # ctest only reports "Bus error"/"Exception"; macOS records a full,
        # symbolicated backtrace for every crash, which is what we need to fix it.
        if: failure() && runner.os == 'macOS'
        run: |
          shopt -s nullglob
          for f in ~/Library/Logs/DiagnosticReports/*.ips; do
            echo "::group::$(basename "$f")"; cat "$f"; echo "::endgroup::"
          done

  examples:
    # The ~60 example targets are part of the public API surface; a compile
    # regression there should fail CI even though we don't run them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: examples-${{ runner.os }}
          max-size: 500M

      - name: Configure CMake (Release + examples)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=ON \
            -DCML_NATIVE_OPTIMIZATIONS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build examples
        run: cmake --build build -j$(nproc)

  sanitizers:
    # AddressSanitizer + UndefinedBehaviorSanitizer build - catches heap
    # corruption, use-after-free, allocator mismatches, and UB that the plain
    # Debug build silently tolerates.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: asan-${{ runner.os }}
          max-size: 500M

      - name: Configure CMake (ASan + UBSan)
        run: |
          cmake -B build-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=OFF \
            -DENABLE_SANITIZERS=ON \
            -DCML_NATIVE_OPTIMIZATIONS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build-asan -j$(nproc)

      - name: Run tests (sanitized)
        run: cd build-asan && ctest --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  python-tests:
    # Build the CFFI bindings against a fresh C library and run the Python
    # suite (numpy/torch parity, autograd, onnx, safetensors, zoo). torch
    # parity tests importorskip when torch is absent.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: python -m pip install numpy pytest cffi setuptools
      - name: Install PyTorch (CPU) for parity tests
        # The op/nn parity suites importorskip torch; installing the CPU wheel
        # makes them run for real in CI instead of silently skipping.
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Build CFFI bindings
        run: cd python && python cml/build_cffi.py
      - name: Run Python tests
        run: cd python && python -m pytest tests/ -q

  format-check:
    # Hard gate: the tree is clang-format-clean. Pin clang-format via pip so the
    # version matches what the code was formatted with (output differs by
    # version); bump this pin and reformat together.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install clang-format (pinned)
        run: python -m pip install "clang-format==20.1.7"
      - name: Check formatting
        run: |
          bad=0
          while IFS= read -r f; do
            if ! clang-format --dry-run --Werror "$f" >/dev/null 2>&1; then
              echo "not formatted: $f"; bad=$((bad+1))
            fi
          done < <(git ls-files 'src/*.c' 'src/**/*.c' 'include/**/*.h' 'tests/*.c' 'tests/**/*.c' 'src/**/*.h' 'tests/**/*.h')
          echo "non-conforming files: $bad"
          test "$bad" -eq 0
