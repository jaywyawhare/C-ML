name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'python/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'python/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    timeout-minutes: 40
    # macOS is a best-effort target (LLVM/CUDA/ROCm/io_uring/InfiniBand are
    # Linux-only); its leg runs informationally and does not fail CI.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        exclude:
          # /usr/bin/gcc on macOS is just an alias for clang
          - os: macos-latest
            compiler: gcc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ccache (Linux)
        run: sudo apt-get install -y ccache
        if: runner.os == 'Linux'

      - name: Install ccache (macOS)
        run: brew install ccache
        if: runner.os == 'macOS'

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ hashFiles('src/**', 'include/**') }}
          restore-keys: ccache-${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=OFF \
            -DCML_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_C_COMPILER=$CC \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}

      - name: Build
        run: cmake --build build -j$(getconf _NPROCESSORS_ONLN)

      - name: Run tests
        run: cd build && ctest --output-on-failure --timeout 240

  examples:
    # The ~60 example targets are part of the public API surface; a compile
    # regression there should fail CI even though we don't run them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ccache
        run: sudo apt-get install -y ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-examples-${{ runner.os }}-${{ hashFiles('src/**', 'include/**', 'examples/**') }}
          restore-keys: ccache-examples-${{ runner.os }}-

      - name: Configure CMake (Release + examples)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build examples
        run: cmake --build build -j$(nproc)

  sanitizers:
    # AddressSanitizer + UndefinedBehaviorSanitizer build — catches heap
    # corruption, use-after-free, allocator mismatches, and UB that the plain
    # Debug build silently tolerates.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ccache
        run: sudo apt-get install -y ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-asan-${{ runner.os }}-${{ hashFiles('src/**', 'include/**') }}
          restore-keys: ccache-asan-${{ runner.os }}-

      - name: Configure CMake (ASan + UBSan)
        run: |
          cmake -B build-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=OFF \
            -DENABLE_SANITIZERS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build-asan -j$(nproc)

      - name: Run tests (sanitized)
        run: cd build-asan && ctest --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  python-tests:
    # Build the CFFI bindings against a fresh C library and run the Python
    # suite (numpy/torch parity, autograd, onnx, safetensors, zoo). torch
    # parity tests importorskip when torch is absent.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: python -m pip install numpy pytest cffi setuptools
      - name: Build CFFI bindings
        run: cd python && python cml/build_cffi.py
      - name: Run Python tests
        run: cd python && python -m pytest tests/ -q

  format-check:
    # Hard gate: the tree is clang-format-clean. Pin clang-format via pip so the
    # version matches what the code was formatted with (output differs by
    # version); bump this pin and reformat together.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install clang-format (pinned)
        run: python -m pip install "clang-format==20.1.7"
      - name: Check formatting
        run: |
          bad=0
          while IFS= read -r f; do
            if ! clang-format --dry-run --Werror "$f" >/dev/null 2>&1; then
              echo "not formatted: $f"; bad=$((bad+1))
            fi
          done < <(git ls-files 'src/*.c' 'src/**/*.c' 'include/**/*.h' 'tests/*.c' 'tests/**/*.c' 'src/**/*.h' 'tests/**/*.h')
          echo "non-conforming files: $bad"
          test "$bad" -eq 0
