name: Deploy Website to GitHub Pages

on:
  push:
    branches: [master]
    paths: [website/**, docs/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: website

      # public/docs is a symlink to ../../docs in the repo; copying through it
      # would target the source files themselves ("same file"). Replace it with
      # a real directory of the markdown so Vite bundles docs into dist/docs.
      - name: Materialize docs into public
        run: |
          rm -f public/docs
          mkdir -p public/docs
          cp ../docs/*.md public/docs/
        working-directory: website

      - name: Build
        run: npm run build
        working-directory: website

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
